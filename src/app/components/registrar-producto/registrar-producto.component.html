<div class="tarjeta">
  <h2>Registrar producto</h2>

  <label>Nombre
    <input [(ngModel)]="nombre" placeholder="Ej: Labial mate rojo" />
  </label>

  <p class="etiqueta">Categoría</p>
  <div class="chips">
    @for (c of categorias; track c) {
      <button type="button" class="chip" [class.activo]="categoria === c" (click)="seleccionar(c)">
        {{ c }}
      </button>
    }
  </div>

  <label>Precio
    <input type="number" [(ngModel)]="precio" placeholder="Ej: 350" />
  </label>

  <label>Stock
    <input type="number" [(ngModel)]="stock" placeholder="Ej: 20" />
  </label>

  <button (click)="guardar()">Guardar producto</button>
  <p [class.mensaje]="!error" [class.error]="error">{{ mensaje }}</p>
</div>
